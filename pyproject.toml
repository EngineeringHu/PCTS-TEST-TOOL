[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pcts-video-tool"
version = "0.6.0"
description = "Local video measurement and review tool for ten-round touch latency tests"
requires-python = ">=3.10,<3.14"
dependencies = [
  "av==17.1.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<4.13",
  "PySide6>=6.8,<6.11",
  "rapidocr==3.10.0",
  "onnxruntime==1.23.2",
  "mediapipe==0.10.31",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyinstaller>=6.11,<7"]

[project.scripts]
pcts-video-tool = "pcts_video_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]

